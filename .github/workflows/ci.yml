name: Klavish CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q tests

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t klavish:ci .
      - name: Smoke-test container
        run: |
          docker run -d --name k -p 18080:8000 klavish:ci || { docker ps -a; exit 1; }
          for i in $(seq 1 40); do curl -fs localhost:18080/api/health && break; sleep 1; done
          docker logs k
          curl -fs localhost:18080/api/health | grep Klavish
          curl -fs localhost:18080/ | grep -q Klavish
