name: Klavish CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q tests

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t klavish:ci .
      - name: Smoke-test container
        run: |
          if ! out=$(docker run -d --name k -p 18080:8000 klavish:ci 2>&1); then
            echo "::error title=docker run::$(echo "$out" | tr '\n' '|' | cut -c1-3000)"
            exit 1
          fi
          ok=0
          for i in $(seq 1 60); do curl -fs localhost:18080/api/health && { ok=1; break; }; sleep 1; done
          if [ "$ok" != 1 ]; then
            echo "::error title=container::$(docker ps -a --format '{{.Status}}' | tr '\n' ' ') | $(docker logs k 2>&1 | tail -25 | tr '\n' '|' | cut -c1-3000)"
            exit 1
          fi
          page=$(curl -fs localhost:18080/) && echo "$page" | grep Klavish >/dev/null && echo "UI OK"
