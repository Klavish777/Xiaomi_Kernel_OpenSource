name: Build Windows installer

on:
  push:
    branches:
      - arena/01a0dce0-xiaomi-kernel-opensource
    paths:
      - 'windows-companion/**'
      - '.github/workflows/windows-installer.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build standalone application
        working-directory: windows-companion
        run: pyinstaller --clean --noconfirm --onefile --windowed --name XiaomiKernelCompanion app.py

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        working-directory: windows-companion
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss'
        shell: pwsh

      - name: Publish downloadable installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "windows-companion-v0.1.0"
          $installer = "windows-companion/dist-installer/XiaomiKernelCompanion-Setup.exe"
          $existing = gh release list --json tagName --jq '.[].tagName' | Where-Object { $_ -eq $tag }
          if ($existing) {
            gh release upload $tag $installer --clobber
          } else {
            gh release create $tag $installer --title "Xiaomi Kernel Companion v0.1.0" --notes "Windows installer for Xiaomi Kernel Companion." --prerelease
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: XiaomiKernelCompanion-Windows-Installer
          path: windows-companion/dist-installer/XiaomiKernelCompanion-Setup.exe
          if-no-files-found: error
          retention-days: 14
