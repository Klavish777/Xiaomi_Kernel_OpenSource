name: Klavish demo render

# Генерирует настоящее видео на раннере GitHub (там открыт интернет, Pollinations бесплатно)
# и коммитит результат в папку demo/ этой же ветки.
on:
  workflow_dispatch:
    inputs:
      idea: { description: "Идея видео", default: "Кот-астронавт открывает новую планету" }
      seconds: { description: "Длина, сек (мин. 15)", default: "20" }
  push:
    paths: [".github/demo-request.txt"]

permissions:
  contents: write

concurrency: { group: klavish-demo, cancel-in-progress: false }

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - name: Generate video
        env:
          POLLINATIONS_KEY: ${{ secrets.POLLINATIONS_KEY }}
        run: |
          IDEA="${{ github.event.inputs.idea }}"; SECS="${{ github.event.inputs.seconds }}"
          if [ -z "$IDEA" ] && [ -f .github/demo-request.txt ]; then
            IDEA=$(sed -n 1p .github/demo-request.txt); SECS=$(sed -n 2p .github/demo-request.txt)
          fi
          rm -rf demo
          python scripts/demo.py "${IDEA:-Кот-астронавт открывает новую планету}" --seconds "${SECS:-20}" --out demo
          echo "::notice title=Klavish demo::$(grep -E '^- ' demo/README.md | tr '\n' ' ')"
      - name: Commit result
        run: |
          git config user.name "klavish-bot"; git config user.email "klavish-bot@users.noreply.github.com"
          git add demo
          git commit -m "demo: AI render [skip ci]" || exit 0
          export GIT_TERMINAL_PROMPT=0
          for i in 1 2 3; do timeout 60 git pull --rebase -q origin "${GITHUB_REF_NAME}" && timeout 60 git push -q origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 3; done
