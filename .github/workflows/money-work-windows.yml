name: Build Money Work for Windows

on:
  push:
    branches:
      - arena/01a0dce0-xiaomi-kernel-opensource
    paths:
      - 'money-work/**'
      - '.github/workflows/money-work-windows.yml'
  pull_request:
    branches:
      - README
    paths:
      - 'money-work/**'
      - '.github/workflows/money-work-windows.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a stable installer after the full Windows test/build job succeeds
        type: boolean
        required: false
        default: false
      verified_demo:
        description: Confirm the candidate passed a user-device check on an MT5 Demo account
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python for the MT5 bridge
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build read-only MT5 connector
        working-directory: money-work
        shell: pwsh
        run: |
          python -m pip install --upgrade pip pyinstaller MetaTrader5 numpy
          pyinstaller --clean --noconfirm --onefile --collect-all MetaTrader5 --collect-all numpy --collect-submodules numpy --hidden-import=numpy._core._multiarray_umath --name mt5-bridge --distpath bridge/dist --workpath bridge/build bridge/mt5_bridge.py
          if (!(Test-Path "bridge/dist/mt5-bridge.exe")) { throw "PyInstaller did not produce bridge/dist/mt5-bridge.exe" }

      - name: Smoke test bundled MT5 connector imports NumPy and MT5
        working-directory: money-work
        shell: pwsh
        run: |
          $reply = '{"action":"status","requestId":1}' | & "bridge/dist/mt5-bridge.exe"
          if ($LASTEXITCODE -ne 0) { throw "MT5 bridge import smoke test failed with exit code $LASTEXITCODE. Output: $reply" }
          $response = ($reply | Select-Object -Last 1) | ConvertFrom-Json
          if ($response.type -ne "response" -or $response.ok -ne $true -or $response.connected -ne $false) {
            throw "Unexpected MT5 bridge smoke-test response: $reply"
          }

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: money-work/package-lock.json

      - name: Verify app version
        working-directory: money-work
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $package = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -ne $package) { throw "VERSION ($version) differs from package.json ($package)" }
          "version=$version" >> $env:GITHUB_OUTPUT
        id: version

      - name: Install app dependencies for tests
        working-directory: money-work
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw "npm ci failed" }
        shell: pwsh

      - name: Run JavaScript agent tests
        working-directory: money-work
        run: |
          npm run test:js
          if ($LASTEXITCODE -ne 0) { throw "Money Work JavaScript tests failed" }
        shell: pwsh

      - name: Run Python trading-risk and mocked MT5 order tests
        working-directory: money-work
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v
          if ($LASTEXITCODE -ne 0) { throw "Money Work Python bridge/risk tests failed" }
        shell: pwsh

      - name: Verify a public AUD/CAD daily reference source
        shell: pwsh
        run: |
          $rate = $null
          $published = $null
          try {
            $reference = Invoke-RestMethod -Uri "https://api.frankfurter.dev/v1/latest?base=AUD&symbols=CAD" -TimeoutSec 20 -Headers @{ Accept = "application/json" }
            if ($reference.base -eq "AUD" -and $reference.rates -and $reference.rates.CAD -gt 0) {
              $rate = [double]$reference.rates.CAD
              $published = [DateTime]::ParseExact($reference.date, "yyyy-MM-dd", [Globalization.CultureInfo]::InvariantCulture)
            }
          } catch { Write-Host "Frankfurter reference check unavailable; trying Bank of Canada fallback: $_" }
          if (!$rate) {
            $reference = Invoke-RestMethod -Uri "https://www.bankofcanada.ca/valet/observations/FXAUDCAD/json?recent=1" -TimeoutSec 20 -Headers @{ Accept = "application/json" }
            $observation = $reference.observations | Where-Object { $_.FXAUDCAD.v -and [double]$_.FXAUDCAD.v -gt 0 } | Select-Object -First 1
            if (!$observation) { throw "Both daily reference sources failed positive-rate/schema checks." }
            $rate = [double]$observation.FXAUDCAD.v
            $published = [DateTime]::ParseExact($observation.d, "yyyy-MM-dd", [Globalization.CultureInfo]::InvariantCulture)
          }
          if ($published.Date -gt [DateTime]::UtcNow.Date) { throw "The public AUD/CAD reference date is in the future: $published" }
          if (([DateTime]::UtcNow.Date - $published.Date).TotalDays -gt 7) { throw "The public AUD/CAD reference is older than seven days: $published" }
          Write-Host "Verified AUD/CAD daily reference $rate published $published"

      - name: Install and build Windows installer
        working-directory: money-work
        run: |
          npm run dist:win
          if ($LASTEXITCODE -ne 0) { throw "Windows installer build failed" }
        shell: pwsh

      - name: Verify MT5 connector is inside the unpacked app
        working-directory: money-work
        shell: pwsh
        run: |
          if (!(Test-Path "release/win-unpacked/resources/mt5-bridge.exe")) {
            throw "Installer payload is missing release/win-unpacked/resources/mt5-bridge.exe"
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: Money-Work-Windows-Installer-${{ github.run_id }}
          path: money-work/release/Money-Work-Setup-${{ steps.version.outputs.version }}.exe
          if-no-files-found: error
          retention-days: 14

  publish-release:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && inputs.verified_demo }}
    needs: windows-installer
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out the tested branch
        uses: actions/checkout@v7

      - name: Download the installer from the successful test/build job
        uses: actions/download-artifact@v8
        with:
          name: Money-Work-Windows-Installer-${{ github.run_id }}
          path: money-work/release

      - name: Publish versioned download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content money-work/VERSION -Raw).Trim()
          $package = (Get-Content money-work/package.json -Raw | ConvertFrom-Json).version
          if ($version -ne $package) { throw "VERSION ($version) differs from package.json ($package)" }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Refusing to publish a prerelease or invalid stable version: $version" }
          $tag = "money-work-v$version"
          $installer = "money-work/release/Money-Work-Setup-$version.exe"
          if (!(Test-Path $installer)) { throw "Tested installer artifact is missing: $installer" }
          $existing = gh release list --json tagName --jq '.[].tagName' | Where-Object { $_ -eq $tag }
          if ($existing) {
            gh release upload $tag $installer --clobber
          } else {
            gh release create $tag $installer --title "Money Work v$version" --notes "Money Work v$version removes the in-app Paper simulator while retaining MT5 Demo and explicitly confirmed MT5 Live connectivity. Bybit is supported through its dedicated MT5 CFD account. Account/position polling and chart refresh use responsive request intervals; new data still depends on MT5 delivery. The 0.01-lot maximum, 0.30 account-currency profit target per 0.01 lot, protective SL/TP, daily stop, and 80-million account-currency balance/equity stop remain in force. Public FX references are daily, not live prices. Tested on an MT5 Demo terminal before release."
          }
